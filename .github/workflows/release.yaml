name: Release
permissions:
  # Allow this action to create releases.
  contents: write
  packages: write
  discussions: write

on:
  push:
    tags:
    - 'v*'
    # A release branch collects a large change before it is tagged. Every push
    # to one publishes an image to try it with, tagged with the branch name
    # and the commit. It is not a release: `latest` and the version tags do
    # not move, and no GitHub release is created.
    branches:
    - 'release/**'
  workflow_dispatch:

# A branch image is tagged with the branch name, so an older run must not
# finish after a newer one and move that tag back. A tag build is never
# cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  SYNAPSE_OPERATOR_REGISTRY_IMAGE: ghcr.io/gen0sec/synapse-operator

jobs:
  # Nothing is built for publication, let alone signed, until the same checks
  # a pull request gets have passed on this very commit.
  checks:
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read

  docker-prepare:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs:
      - checks
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      final: ${{ steps.ref.outputs.final }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify the ref
        id: ref
        # final:      vX.Y.Z and nothing after it. Only this moves `latest`
        #             and the X.Y / X tags.
        # prerelease: vX.Y.Z-anything, e.g. v0.2.0-rc.1. It is published
        #             under its own tag only.
        run: .github/scripts/classify-ref.sh >> "${GITHUB_OUTPUT}"

      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake -f docker-bake.hcl image-all --print | jq -cr '.target."image-all".platforms')" >>${GITHUB_OUTPUT}

      - name: Show matrix
        run: |
          echo ${{ steps.platforms.outputs.matrix }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SYNAPSE_OPERATOR_REGISTRY_IMAGE }}
          # `latest` is set below and nowhere else: left to itself the
          # action adds it for any tag a pattern matches.
          flavor: |
            latest=false
          # The patterns are anchored. Unanchored, v0.2.0-rc.1 matched the
          # first three and was published as 0.2.0, 0.2 and 0.
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=match,pattern=^v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^v(\d+)\.\d+\.\d+$,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+-.+)$,group=1
            type=raw,value=latest,enable=${{ steps.ref.outputs.final }}

      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}/synapse-bake-meta.json"

      - name: Upload meta bake definition
        uses: actions/upload-artifact@v7
        with:
          name: synapse-operator-bake-meta
          path: ${{ runner.temp }}/synapse-bake-meta.json
          if-no-files-found: error
          retention-days: 1

  docker-build:
    timeout-minutes: 45
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs:
      - docker-prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.docker-prepare.outputs.matrix) }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Download meta bake definition
        uses: actions/download-artifact@v8
        with:
          name: synapse-operator-bake-meta
          path: ${{ runner.temp }}

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        id: bake
        uses: docker/bake-action@v7
        with:
          files: |
            docker-bake.hcl
            cwd://${{ runner.temp }}/synapse-bake-meta.json
          targets: image
          set: |
            *.tags=${{ env.SYNAPSE_OPERATOR_REGISTRY_IMAGE }}
            *.platform=${{ matrix.platform }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: synapse-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs:
      - docker-prepare
      - docker-build
    permissions:
      # MUST be write: this job also creates the GitHub release, and
      # job-level permissions REPLACE the workflow-level block rather than
      # merging with it. Leaving this at read silently reduced the token to
      # read-only and the release step failed with 403 "Resource not
      # accessible by integration" - after the images had already pushed.
      contents: write
      packages: write
      # Keyless signing trades this OIDC token with Fulcio for a short-lived
      # certificate; without it cosign has no identity to bind a signature to.
      id-token: write
    steps:
      - name: Download meta bake definition
        uses: actions/download-artifact@v8
        with:
          name: synapse-operator-bake-meta
          path: ${{ runner.temp }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: synapse-digests-*
          merge-multiple: true

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.target."docker-metadata-action".tags | map(select(startswith("${{ env.SYNAPSE_OPERATOR_REGISTRY_IMAGE }}")) | "-t " + .) | join(" ")' ${{ runner.temp }}/synapse-bake-meta.json) \
            $(printf '${{ env.SYNAPSE_OPERATOR_REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.SYNAPSE_OPERATOR_REGISTRY_IMAGE }}:$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' ${{ runner.temp }}/synapse-bake-meta.json)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the image
        env:
          IMAGE: ${{ env.SYNAPSE_OPERATOR_REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          # Sign the manifest-list digest, never a tag: tags are mutable, so a
          # tag signature does not pin the bytes a verifier will pull.
          tag=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' ${{ runner.temp }}/synapse-bake-meta.json)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')
          echo "Signing ${IMAGE}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"

          # Verify with the same constraints a consumer would apply, so an
          # unverifiable signature fails the release here rather than in
          # somebody else's admission controller.
          # Exact identity, not a regexp: the run knows its own ref, and the
          # certificate Fulcio issued names exactly this workflow at this ref.
          # Anything else means the signature did not come from this run.
          cosign verify "${IMAGE}@${digest}" \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - name: Checkout
        # For the CRDs attached to the release.
        if: needs.docker-prepare.outputs.final == 'true' || needs.docker-prepare.outputs.prerelease == 'true'
        uses: actions/checkout@v7

      - name: Release
        # Only a version tag is a release; a branch build stops at the image.
        # A pre-release tag is marked as one and never becomes the latest.
        if: needs.docker-prepare.outputs.final == 'true' || needs.docker-prepare.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          discussion_category_name: Releases
          generate_release_notes: true
          prerelease: ${{ needs.docker-prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.docker-prepare.outputs.final }}
          # The image does not carry the CRDs; this is where they ship.
          files: config/crd/bases/*.yaml
          fail_on_unmatched_files: true
