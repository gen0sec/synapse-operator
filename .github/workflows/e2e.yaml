name: Synapse Operator End to End
# A SynapseProxy on a real cluster: k3s in a container, the operator built
# from the commit, Synapse in the pods it creates.
#
# It needs a Synapse image, and that image is not public. So it is off until
# the repository variable E2E_SYNAPSE_IMAGE names one this repository's
# workflows have been given read access to.
on:
  pull_request:
      branches:
        - main
        - 'release/**'
  push:
      branches:
        - main
        - 'release/**'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End to end (k3s)
    # A pull request from a fork gets no access to the image either way.
    if: >-
      vars.E2E_SYNAPSE_IMAGE != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Log in to the registry the Synapse image is in
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Run the end-to-end test
        env:
          E2E_SYNAPSE_IMAGE: ${{ vars.E2E_SYNAPSE_IMAGE }}
        run: make e2e
