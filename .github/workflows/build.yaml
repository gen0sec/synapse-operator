name: Synapse Operator Build
on:
  pull_request:
      branches:
        - main
        # A large change is collected on a release branch before it reaches
        # main; pull requests into one get the same checks.
        - 'release/**'
  # The branch itself, after each merge: two pull requests can each be green
  # and still break once both are in. A release branch gets the same from the
  # release workflow, which runs these jobs before it publishes anything.
  push:
      branches:
        - main
  workflow_call:

env:
  GO_VERSION: '1.26'

# Each job is one check on a pull request, named for what it proves.
jobs:
  verify:
    timeout-minutes: 15
    name: Verify (tidy, vet, generated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Check generated files are up to date
        run: make verify-generated

  test:
    timeout-minutes: 30
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Cache the test API server binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ matrix.arch }}-${{ hashFiles('internal/testenv/testenv.go', '.github/workflows/build.yaml') }}
      - name: Run tests
        # Every package: a bare `go test` only covers the root one.
        run: go test -v ./...

  test-oldest-kubernetes:
    timeout-minutes: 30
    # The oldest version the CRD's validation rules are meant to work on.
    name: Test (Kubernetes 1.30)
    runs-on: ubuntu-latest
    env:
      ENVTEST_K8S_VERSION: "1.30.3"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Cache the test API server binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-oldest-${{ hashFiles('internal/testenv/testenv.go', '.github/workflows/build.yaml') }}
      - name: Run tests
        run: go test -v ./...

  image:
    timeout-minutes: 30
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      # For `go version -m` below; nothing is compiled outside the image.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker buildx bake image-local
      - name: Check the image
        # The binary must be built for the platform the image claims, and it
        # must start.
        run: |
          arch=$(docker image inspect synapse-operator:local --format '{{.Architecture}}')
          cid=$(docker create synapse-operator:local)
          docker cp "${cid}:/app/manager" "${RUNNER_TEMP}/manager"
          docker rm "${cid}" >/dev/null
          go version -m "${RUNNER_TEMP}/manager" | grep -F "GOARCH=${arch}"
          docker run --rm synapse-operator:local -h >/dev/null
