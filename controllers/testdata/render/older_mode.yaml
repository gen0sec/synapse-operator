# v2: no passthrough host
# Generated by synapse-operator ingress controller. Do not edit.
version: 2
timeouts:
  read: 120
proxy:
  fingerprints:
    forward: false
hosts:
  "*.wild.example.com":
    tls:
      terminate: {}
    paths:
      "/":
        upstream: "app.aaa.svc.cluster.local:80"
        ssl_enabled: false
  "api.example.com":
    tls:
      terminate: {}
    paths:
      "expr:(?-s:/v[0-9]+/.*)":
        upstream: "app.zzz.svc.cluster.local:80"
        match_expr: "http.request.path matches \"^(?:(?-s:/v[0-9]+/.*))\""
        ssl_enabled: false
  "gw.example.com":
    tls:
      terminate: {}
    paths:
      "/":
        upstream: "gwapp.zzz.svc.cluster.local:8080"
        ssl_enabled: false
  "shop.example.com":
    tls:
      terminate:
        cert: "shop.example.com"
    paths:
      "/":
        upstream: "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
      "/.well-known/acme-challenge/tok":
        upstream: "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
      "/guest":
        upstream: "app.aaa.svc.cluster.local:80"
        ssl_enabled: false
  "www.shop.example.com":
    tls:
      terminate: {}
    paths:
      "/":
        upstream: "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
# certificates
shop.example.com.crt: CRT-guest
shop.example.com.key: KEY-guest
