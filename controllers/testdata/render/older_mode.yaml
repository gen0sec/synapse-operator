# v1: no passthrough host
# Generated by synapse-operator ingress controller. Do not edit.
upstreams:
  "*.wild.example.com":
    paths:
      "/":
        servers:
          - "app.aaa.svc.cluster.local:80"
        ssl_enabled: false
  "api.example.com":
    paths:
      "expr:/v[0-9]+/.*":
        servers:
          - "app.zzz.svc.cluster.local:80"
        match_expr: "http.request.path matches \"^(?:/v[0-9]+/.*)\""
        ssl_enabled: false
  "gw.example.com":
    paths:
      "/":
        servers:
          - "gwapp.zzz.svc.cluster.local:8080"
        ssl_enabled: false
  "shop.example.com":
    certificate: "shop.example.com"
    paths:
      "/":
        servers:
          - "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
      "/.well-known/acme-challenge/tok":
        servers:
          - "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
        request_headers: []
        response_headers: []
      "/guest":
        servers:
          - "app.aaa.svc.cluster.local:80"
        ssl_enabled: false
  "www.shop.example.com":
    paths:
      "/":
        servers:
          - "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
# certificates
shop.example.com.crt: CRT-guest
shop.example.com.key: KEY-guest
# v2: a passthrough host
# Generated by synapse-operator ingress controller. Do not edit.
version: 2
hosts:
  "*.wild.example.com":
    tls:
      terminate: {}
    paths:
      "/":
        upstream: "app.aaa.svc.cluster.local:80"
  "api.example.com":
    tls:
      terminate: {}
    paths:
      "expr:(?-s:/v[0-9]+/.*)":
        upstream: "app.zzz.svc.cluster.local:80"
        match_expr: "http.request.path matches \"^(?:(?-s:/v[0-9]+/.*))\""
  "gw.example.com":
    tls:
      terminate: {}
    paths:
      "/":
        upstream: "gwapp.zzz.svc.cluster.local:8080"
  "raw.example.com":
    tls:
      passthrough: true
    upstream: "app.zzz.svc.cluster.local:80"
  "shop.example.com":
    tls:
      terminate:
        cert: "shop.example.com"
    paths:
      "/":
        upstream: "app.zzz.svc.cluster.local:80"
      "/.well-known/acme-challenge/tok":
        upstream: "app.zzz.svc.cluster.local:80"
        ssl_enabled: false
      "/guest":
        upstream: "app.aaa.svc.cluster.local:80"
  "www.shop.example.com":
    tls:
      terminate: {}
    paths:
      "/":
        upstream: "app.zzz.svc.cluster.local:80"
# certificates
shop.example.com.crt: CRT-guest
shop.example.com.key: KEY-guest
