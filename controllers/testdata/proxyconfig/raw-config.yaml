# Generated by synapse-operator from a SynapseProxy. Do not edit.
daemon:
  enabled: false
ids:
  enabled: true
  enforce_block: true
  rule_paths:
  - /etc/synapse/rules/*.rules
logging:
  file_logging_enabled: false
mode: proxy
platform:
  geoip:
    country:
      path: /var/lib/synapse/ipinfo_lite.mmdb
      url: https://github.com/gen0sec/geoip-databases/raw/download/ipinfo_lite.mmdb
  threat:
    path: /var/lib/synapse
    url: https://download.gen0sec.com/v1
proxy:
  captcha:
    cache_ttl: 300
    token_ttl: 7200
  certificates: /etc/synapse/certs
  default_certificate: default
  h2c: false
  internal_services:
    enabled: true
  listeners:
  - address: 0.0.0.0:80
    mode: http
    name: http
  max_downstream_connections: 20000
  redis:
    prefix: edge
  upstream:
    conf: /etc/synapse/upstreams/upstreams.yaml
telemetry:
  enabled: true
  otlp:
    endpoint: http://collector:4317
