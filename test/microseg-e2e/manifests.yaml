# East-west microsegmentation e2e test topology.
#
# Three workloads + a NetworkPolicy that declares "api accepts ingress ONLY
# from frontend on 8080". The operator EdgeProducer compiles this into:
#     E ew-microseg-test/frontend > ew-microseg-test/api : 8080
#     G ew-microseg-test/api
# So the agent's edge.* verdicts must be:
#     frontend -> api:8080   declared=1  policy_violation=0   (allowed)
#     attacker -> api:8080   declared=0  policy_violation=1   (VIOLATION)
#
# Before applying: replace CANARY_NODE with the hostname of the 6.11 node your
# synapse-agent canary runs on (so the agent there observes ingress to `api`):
#     sed "s/CANARY_NODE/$(your-node)/" manifests.yaml | kubectl apply -f -
---
apiVersion: v1
kind: Namespace
metadata:
  name: ew-microseg-test
  labels:
    kubernetes.io/metadata.name: ew-microseg-test
---
# api — the protected workload. Pinned to the canary node so the agent there
# captures ingress to it (over the VXLAN overlay from the other node).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ew-microseg-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      nodeSelector:
        kubernetes.io/hostname: CANARY_NODE
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=api-ok"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ew-microseg-test
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
---
# frontend — ALLOWED source. NetworkPolicy permits frontend -> api:8080.
# Anti-affinity off the api node so the traffic crosses nodes (VXLAN-encapped),
# which is what the agent's overlay capture + decap observes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ew-microseg-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: api }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: gen
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -T2 -O- http://api.ew-microseg-test.svc:8080 >/dev/null 2>&1 || true; sleep 2; done"
---
# attacker — VIOLATING source. No NetworkPolicy rule permits attacker -> api,
# yet api is governed, so the agent must flag edge.policy_violation == 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attacker
  namespace: ew-microseg-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: attacker }
  template:
    metadata:
      labels: { app: attacker }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: api }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: gen
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -T2 -O- http://api.ew-microseg-test.svc:8080 >/dev/null 2>&1 || true; sleep 2; done"
---
# The declaration the operator compiles. api accepts ingress ONLY from frontend
# on 8080; attacker is therefore a policy violation. (Whether the CNI *enforces*
# this is independent — the agent computes the verdict from the declaration.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-frontend
  namespace: ew-microseg-test
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: frontend }
      ports:
        - protocol: TCP
          port: 8080
