# What running SynapseAgent resources takes on top of the operator in ../:
# the role its controller needs. The CRDs are in ../crd, which
# config/proxy-controller already carries, so leaving them out here lets the
# two be applied together.
#
#   kubectl apply -k config
#   kubectl apply -k config/crd
#   kubectl apply -k config/agent-controller
#
# and --agent-controller in the operator's arguments.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
