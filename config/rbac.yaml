apiVersion: v1
kind: ServiceAccount
metadata:
  name: synapse-operator
  namespace: synapse-os
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: synapse-operator
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # NetVarsResolverReconciler (--netvars-resolver) reads Node IPs + PodCIDRs +
  # LoadBalancer Service VIPs to auto-fill ids.address_vars.HOME_NET/EXTERNAL_NET.
  - apiGroups:
      - ""
    resources:
      - nodes
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # IdentityProducerReconciler (--identity-producer) + EdgeProducerReconciler
  # (--edge-producer) read Pods (IP->workload), NetworkPolicies (declared
  # edges), and Namespaces (namespaceSelector resolution) to build the identity
  # MMDB + declared-edge allow-list. Read-only.
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: synapse-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: synapse-operator
subjects:
  - kind: ServiceAccount
    name: synapse-operator
    namespace: synapse-os

