# Operator deployment running the east-west PRODUCERS (identity + declared-edge).
#
# Part of the default install. It is a second Deployment of the operator image
# with the two producer modes on and the config-hash controller off, so each
# Deployment holds its own leader lease. It runs as the read-only
# synapse-operator-producers ServiceAccount from config/rbac-producers.yaml.
#
# Upgrading:
#   - The image MUST be overridden for BOTH Deployments, through a kustomize
#     `images:` entry for `synapse-operator`. Both use synapse-operator:local.
#   - Anyone who added --identity-producer or --edge-producer to the
#     synapse-operator (controller) Deployment by hand MUST remove them, or
#     both Deployments upload.
#
# Without the Secret below the producers start, log once and stay idle. To
# enable them, create it and restart the Deployment:
#   kubectl -n synapse-os create secret generic synapse-operator-api \
#     --from-literal=api-key='<key-with-identity:write>'
#   kubectl -n synapse-os rollout restart deployment/synapse-operator-producers
#
# --download-api-url is the download-api base (default https://api.gen0sec.com/v1).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-operator-producers
  namespace: synapse-os
  labels:
    app.kubernetes.io/name: synapse-operator
    app.kubernetes.io/component: producers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse-operator
      app.kubernetes.io/component: producers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-operator
        app.kubernetes.io/component: producers
    spec:
      serviceAccountName: synapse-operator-producers
      containers:
        - name: manager
          image: synapse-operator:local
          imagePullPolicy: IfNotPresent
          args:
            - "--leader-elect"
            - "--leader-election-id=producers.synapse.gen0sec.com"
            - "--config-hash-controller=false"
            - "--identity-producer"
            - "--edge-producer"
            - "--download-api-url=https://api.gen0sec.com/v1"
            - "--identity-producer-interval=60s"
            - "--edge-producer-interval=60s"
          env:
            - name: SYNAPSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synapse-operator-api
                  key: api-key
                  optional: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
